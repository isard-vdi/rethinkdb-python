name: CI

on:
  push:
    branches: [main, master, modernize-python-client]
  pull_request:
    branches: [main, master, modernize-python-client]

jobs:
  unit-tests:
    name: Unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        run: pytest tests/ --ignore=tests/integration -v --cov=rethinkdb --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration-tests:
    name: Integration tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    services:
      rethinkdb:
        image: rethinkdb:2.4
        ports:
          - 28015:28015

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run integration tests
        env:
          RETHINKDB_HOST: 127.0.0.1
        run: pytest tests/integration -v -m integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Run black
        run: black --check rethinkdb/ tests/

      - name: Run isort
        run: isort --check-only rethinkdb/ tests/

      - name: Run flake8 (advisory)
        run: flake8 rethinkdb/ || true

  type-check:
    name: Type check (mypy strict on typed surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      # Strict pass: connection_pool.py must stay strictly typed.
      # Per-module strict overrides in pyproject.toml drive this; we just
      # invoke mypy and require a clean exit on the typed surface.
      - name: Run mypy on typed modules
        run: mypy rethinkdb/connection_pool.py

      # Non-strict pass over the whole package — must succeed for the
      # legacy untyped surface (per-module ignore_errors overrides handle
      # the messy parts) but with disallow_untyped_defs disabled. If this
      # starts failing, the override block in pyproject.toml is the place
      # to widen ignores for newly-broken legacy modules.
      - name: Run mypy on full package
        run: mypy rethinkdb/