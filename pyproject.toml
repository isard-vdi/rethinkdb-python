[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rethinkdb"
dynamic = ["version"]
description = "Python driver library for the RethinkDB database server."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "RethinkDB", email = "bugs@rethinkdb.com"}
]
maintainers = [
    {name = "RethinkDB", email = "bugs@rethinkdb.com"}
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "packaging>=21.0",
]

[project.optional-dependencies]
# Async backend extras. asyncio is built into the stdlib, so it has no
# runtime dependency. The other backends are only needed if you call
# r.set_loop_type("<backend>") and use that backend's connection.
tornado = ["tornado>=6.3"]
trio = ["trio>=0.22.0", "outcome>=1.2.0", "attrs>=22.0"]
gevent = ["gevent>=21.0"]
twisted = ["twisted>=22.0"]

# Dev extras: linting, type-checking, formatting. Pinned to a major
# version range so CI is reproducible — bump deliberately when adopting
# new formatter rules so reformat churn shows up as its own commit.
dev = [
    "black~=26.0",
    "isort~=8.0",
    "flake8>=6.0",
    "mypy~=1.20",
]

# Test extras: everything needed to run the full test suite, including
# tests for the optional async backends. Production installs that only
# need one backend should use that backend's individual extra (e.g.
# `pip install rethinkdb[tornado]`); `[test]` is for CI / contributors.
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "coverage>=7.0",
    "tornado>=6.3",
    "trio>=0.22.0",
    "outcome>=1.2.0",
    "attrs>=22.0",
]

[project.urls]
Homepage = "https://github.com/RethinkDB/rethinkdb-python"
Repository = "https://github.com/RethinkDB/rethinkdb-python"
"Bug Tracker" = "https://github.com/RethinkDB/rethinkdb-python/issues"

[project.scripts]
rethinkdb-import = "rethinkdb._import:main"
rethinkdb-dump = "rethinkdb._dump:main"
rethinkdb-export = "rethinkdb._export:main"
rethinkdb-restore = "rethinkdb._restore:main"
rethinkdb-index-rebuild = "rethinkdb._index_rebuild:main"
rethinkdb-repl = "rethinkdb.__main__:startInterpreter"

[tool.setuptools.dynamic]
version = {attr = "rethinkdb.version.VERSION"}

[tool.setuptools.packages.find]
include = ["rethinkdb*"]

[tool.setuptools.package-data]
rethinkdb = ["py.typed", "backports/ssl_match_hostname/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests that do not require a live RethinkDB server",
    "integration: integration tests that require a live RethinkDB server",
]
# `strict` (default) requires explicit @pytest.mark.asyncio. `auto`
# would conflict with pytest-trio (also installed via the [test] extra)
# because both plugins claim async test functions in auto mode.
asyncio_mode = "strict"

[tool.coverage.run]
source = ["rethinkdb"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

# Mypy is split into a lenient global pass for the legacy surface and a
# strict per-module pass for the public API written with full type hints.
# When you add a new public module, add it to the strict-overrides list.
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
strict_equality = true
ignore_missing_imports = true
# Legacy modules (net.py, ast.py, _dump.py, etc.) are mostly untyped.
# Don't break the world; opt the typed surface in via overrides.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["rethinkdb.connection_pool"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Backend-specific networking modules use coroutine decorators or yield-from
# idioms that mypy can't analyse without their own type stubs.
module = [
    "rethinkdb.gevent_net.*",
    "rethinkdb.tornado_net.*",
    "rethinkdb.trio_net.*",
    "rethinkdb.twisted_net.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Generated protobuf stub — checked in by hand, not worth typing.
module = ["rethinkdb.ql2_pb2"]
ignore_errors = true

[[tool.mypy.overrides]]
# Legacy CLI / data-import modules. Mostly untyped, with Py2-era
# `unicode = str` shims that confuse mypy. Type these incrementally
# in dedicated `chore(typing): annotate <module>` commits.
module = [
    "rethinkdb.ast",
    "rethinkdb._dump",
    "rethinkdb._export",
    "rethinkdb._import",
    "rethinkdb._index_rebuild",
    "rethinkdb._restore",
    "rethinkdb.docs",
    "rethinkdb.errors",
    "rethinkdb.handshake",
    "rethinkdb.utils_common",
]
ignore_errors = true

[[tool.mypy.overrides]]
# pytest internals use match statements (3.10+ syntax) that trip the
# 3.9 baseline we ask mypy to validate against.
module = ["_pytest.*"]
follow_imports = "skip"
